<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; }
  .shell { display: flex; flex-direction: row; height: 100vh; overflow: hidden; }
  .sidebar { width: 200px; background: #333; color: #fff; }
  .sidebar.collapsed { width: 56px; }            /* (0,2,0) */
  .content { flex: 1; margin-inline-start: 200px; padding: 24px; overflow: hidden; }
  .shell.collapsed .content { margin-inline-start: 56px; }   /* (0,3,0) */
  .page { max-width: 1100px; margin: 0 auto; height: 100%; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 10px; white-space: nowrap; border: 1px solid #ccc; padding-left: 20px; }
  @media (max-width: 768px) {
    .sidebar { display: none; }              /* (0,1,0) — loses to .sidebar.collapsed? no: only width set there */
    .content { margin-inline-start: 0; }     /* (0,1,0) — LOSES to .shell.collapsed .content (0,3,0) */
  }
</style>
<script>
  // persisted UI state, like a real app
  if (localStorage.getItem('collapsed') === '1') {
    document.documentElement.addEventListener('DOMContentLoaded', ()=>{});
  }
  window.addEventListener('DOMContentLoaded', ()=>{
    if (localStorage.getItem('collapsed') === '1') {
      document.querySelector('.shell').classList.add('collapsed');
      document.querySelector('.sidebar').classList.add('collapsed');
    }
  });
</script>
</head>
<body>
  <div class="shell">
    <nav class="sidebar">menu</nav>
    <main class="content">
      <div class="page">
        <h1>דו״ח</h1>
        <table>
          <tr><th>שם</th><th>ארגון</th><th>משתמש</th><th>אימייל</th><th>פעולות</th><th>סטטוס</th></tr>
          <tr><td>פרופיל א</td><td>org-1</td><td>user-1</td><td>a@b.c</td><td>edit</td><td>ok</td></tr>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
